---
- name: Configure Vault credentials for DCC workshop
  hosts: localhost
  gather_facts: false
  connection: local

  vars_files:
    - vars/workshop.yml

  vars:
    vault_api: "{{ vault_addr }}/v1"
    vault_headers:
      X-Vault-Token: "{{ vault_token }}"
      Content-Type: application/json

  tasks:
    - name: Wait for Vault to be unsealed
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
        status_code: [200, 429]
        validate_certs: false
      retries: 30
      delay: 10
      register: _vault_health
      until: _vault_health is succeeded

    # ── KV v2 secrets engine ──────────────────────────────────────────
    - name: Check if KV secrets engine is mounted
      ansible.builtin.uri:
        url: "{{ vault_api }}/sys/mounts"
        headers: "{{ vault_headers }}"
        validate_certs: false
      register: _mounts

    - name: Enable KV v2 secrets engine
      ansible.builtin.uri:
        url: "{{ vault_api }}/sys/mounts/secret"
        method: POST
        headers: "{{ vault_headers }}"
        body_format: json
        body:
          type: kv
          options:
            version: "2"
        validate_certs: false
        status_code: [200, 204]
      when: "'secret/' not in _mounts.json.data"

    # ── App server machine credential ─────────────────────────────────
    - name: Write app server SSH credential to Vault
      ansible.builtin.uri:
        url: "{{ vault_api }}/secret/data/dcc/app-server"
        method: POST
        headers: "{{ vault_headers }}"
        body_format: json
        body:
          data:
            ssh_user: rhel
            ssh_password: "{{ aap_password }}"
            description: "Machine credential for DCC app server (rhel01)"
        validate_certs: false
        status_code: [200]
      register: _app_cred

    # ── AAP admin credential reference ────────────────────────────────
    - name: Write AAP admin credential to Vault
      ansible.builtin.uri:
        url: "{{ vault_api }}/secret/data/dcc/aap"
        method: POST
        headers: "{{ vault_headers }}"
        body_format: json
        body:
          data:
            admin_user: "{{ aap_user }}"
            admin_password: "{{ aap_password }}"
            controller_url: "{{ aap_host }}"
            description: "AAP Controller admin credential for DCC workshop"
        validate_certs: false
        status_code: [200]

    # ── EDA credential reference ──────────────────────────────────────
    - name: Write EDA credential to Vault
      ansible.builtin.uri:
        url: "{{ vault_api }}/secret/data/dcc/eda"
        method: POST
        headers: "{{ vault_headers }}"
        body_format: json
        body:
          data:
            admin_user: "{{ eda_user }}"
            admin_password: "{{ eda_password }}"
            eda_url: "{{ eda_host }}"
            description: "EDA Controller credential for DCC workshop"
        validate_certs: false
        status_code: [200]

    - name: Report Vault configuration status
      ansible.builtin.debug:
        msg: |
          Vault configured for DCC workshop:
            KV engine:  secret/ (v2)
            Credentials stored:
              - secret/dcc/app-server  (machine SSH)
              - secret/dcc/aap         (AAP admin)
              - secret/dcc/eda         (EDA admin)
