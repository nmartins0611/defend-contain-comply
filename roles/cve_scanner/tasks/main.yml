---
- name: Ensure scan output directory exists
  ansible.builtin.file:
    path: "{{ scan_output_dir }}"
    state: directory
    mode: "0755"

- name: Run yum-based CVE scan
  ansible.builtin.command:
    cmd: yum updateinfo list cves --quiet
  register: _cve_scan_raw
  changed_when: false
  when: scan_method == "yum"

- name: Check for target CVE presence
  ansible.builtin.set_fact:
    cve_scanner_detected: "{{ target_cve in _cve_scan_raw.stdout }}"
    cve_scanner_output: "{{ _cve_scan_raw.stdout }}"

- name: Gather CVE advisory details
  ansible.builtin.command:
    cmd: "yum updateinfo info {{ target_cve }} --quiet"
  register: _cve_detail
  changed_when: false
  when: cve_scanner_detected | bool

- name: Write scan results
  ansible.builtin.copy:
    content: |
      host: {{ inventory_hostname }}
      timestamp: {{ ansible_date_time.iso8601 }}
      cve: {{ target_cve }}
      detected: {{ cve_scanner_detected }}
      details: |
        {{ _cve_detail.stdout | default('N/A') | indent(4) }}
    dest: "{{ scan_output_dir }}/{{ target_cve }}-report.yml"
    mode: "0644"
