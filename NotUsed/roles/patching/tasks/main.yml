---
- name: Record pre-patch state
  ansible.builtin.command:
    cmd: "rpm -q {{ target_service }}"
  register: _patching_pre_version
  changed_when: false

- name: Apply security advisory
  ansible.builtin.dnf:
    name: "*"
    security: true
    advisory: "{{ target_advisory }}"
    state: latest
  register: _patching_result

- name: Record post-patch state
  ansible.builtin.command:
    cmd: "rpm -q {{ target_service }}"
  register: _patching_post_version
  changed_when: false

- name: Restart service if packages changed
  ansible.builtin.systemd:
    name: "{{ target_service }}"
    state: restarted
  when:
    - _patching_result.changed
    - restart_after_patch | bool
  notify: Verify service health

- name: Export patch facts
  ansible.builtin.set_fact:
    patching_applied: "{{ _patching_result.changed }}"
    patching_pre_version: "{{ _patching_pre_version.stdout }}"
    patching_post_version: "{{ _patching_post_version.stdout }}"
